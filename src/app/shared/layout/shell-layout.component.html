<div class="app-shell" [class.tema-oscuro]="temaOscuro" [class.menu-abierto]="menuOpen">
  <aside class="sidebar">
    <div class="brand-panel">
      <img src="assets/img/logo_dimabug.png" alt="DimaBug" class="brand-logo" />
    </div>

    <nav>
      <p class="nav-label">Principal</p>
      <a routerLink="/inicio" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/>
        </svg>
        Inicio
      </a>
      <a routerLink="/conocimiento" routerLinkActive="activo" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
        Conocimiento
      </a>
      <a routerLink="/favoritos" routerLinkActive="activo" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.6l2.35 4.76 5.25.76-3.8 3.7.9 5.24L12 15.7l-4.7 2.46.9-5.24-3.8-3.7 5.25-.76L12 3.6z"/>
        </svg>
        Favoritos
      </a>
      <a routerLink="/error/nuevo" routerLinkActive="activo" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v8M8 12h8"/>
        </svg>
        Nuevo error
      </a>
      @if (isStaff()) {
        <a routerLink="/procedimientos" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 12h6M9 16h4"/>
          </svg>
          Procedimientos
        </a>
        <a routerLink="/ejecuciones" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M10 8.8l6 3.2-6 3.2V8.8z"/>
          </svg>
          Mis ejecuciones
        </a>
        <a routerLink="/reportes" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V5M4 19h16"/>
            <path d="M8 16v-5M12 16V8M16 16v-3"/>
          </svg>
          Reportes
        </a>

        <p class="nav-label">Catálogos</p>
        <a routerLink="/plataforma/hardware" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"/>
            <path d="M8 20h8M12 16v4"/>
          </svg>
          Hardware
        </a>
        <a routerLink="/departamentos" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="2"/>
            <path d="M8 7h8M8 11h8M8 15h5"/>
          </svg>
          Departamentos
        </a>
        <a routerLink="/pruebas" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="3" width="12" height="18" rx="2"/>
            <path d="M9 8h6M9 12h6M9 16h3"/>
          </svg>
          Pruebas
        </a>
        <a routerLink="/soluciones" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
          </svg>
          Soluciones
        </a>
      }

      <p class="nav-label">Sistema</p>
      @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 4v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7l8-4z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
          Admin
        </a>
        <a routerLink="/usuarios" routerLinkActive="activo" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
          </svg>
          Usuarios
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header>
      <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Menú">☰</button>
      <div class="header-actions">
        <button
          type="button"
          class="tema-toggle"
          (click)="toggleTema()"
          [attr.aria-label]="temaOscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
          [title]="temaOscuro ? 'Tema claro' : 'Tema oscuro'"
        >
          @if (temaOscuro) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 14.3A8.5 8.5 0 1112.2 3 6.8 6.8 0 0021 14.3z"/>
            </svg>
          }
        </button>

        <div class="usuario-wrap" [class.abierto]="usuarioMenuOpen">
          <button type="button" class="usuario" (click)="toggleUsuarioMenu($event)" [attr.aria-expanded]="usuarioMenuOpen">
            <div class="avatar">{{ iniciales() }}</div>
            <div class="usuario-info">
              <div class="usuario-nombre">{{ usuarioLogin() }}</div>
              <div class="usuario-rol">{{ rolNombre() }}</div>
            </div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>

          @if (usuarioMenuOpen) {
            <div class="usuario-menu" role="menu">
              <div class="usuario-menu-head">
                <strong>{{ usuarioLogin() }}</strong>
                <span>{{ rolNombre() }}</span>
              </div>
              <button type="button" class="logout-item" (click)="logout()">Cerrar sesión</button>
            </div>
          }
        </div>
      </div>
    </header>

    <div class="contenido" [class.fade-in]="fadeIn">
      <router-outlet />
    </div>
  </div>
</div>
